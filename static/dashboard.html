<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADPAY - 대시보드</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <script>
    function switchToMobile() {
        try { sessionStorage.removeItem('preferDesktop'); } catch (e) {}
        window.location.replace('/static/mobile/mobile.html');
    }
    (function() {
        try {
            var params = new URLSearchParams(window.location.search);
            if (params.get('view') === 'desktop') {
                sessionStorage.setItem('preferDesktop', '1');
            }
            var preferDesktop = sessionStorage.getItem('preferDesktop') === '1';

            var u = JSON.parse(localStorage.getItem('user') || 'null');
            var isMobile = /Mobi|Android|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            var isOwnerMobile = u && u.role === 'owner' && isMobile;

            if (isOwnerMobile && !preferDesktop) {
                window.location.replace('/static/mobile/mobile.html');
                return;
            }
            if (isOwnerMobile) {
                document.addEventListener('DOMContentLoaded', function() {
                    var btn = document.getElementById('goMobileBtn');
                    if (btn) btn.classList.remove('d-none');
                });
            }
        } catch (e) {}
    })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="brand">
            <i class="fas fa-credit-card"></i>
            <span id="sidebarBrand">ADPAY</span>
        </div>
        <div class="user-info">
            <div class="user-name" id="sidebarUserName">-</div>
            <span class="user-role" id="sidebarRole">-</span>
        </div>
        <nav id="sidebarNav">
            <!-- Dynamically filled based on role -->
        </nav>
        <div class="sidebar-footer">
            <a href="#" class="nav-link" onclick="logout()"><i class="fas fa-sign-out-alt"></i>로그아웃</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Mobile sidebar toggle (shown only on small screens) -->
        <div class="d-md-none mobile-header" style="display:flex; align-items:center; gap:.5rem;">
            <button class="btn btn-sm btn-outline-secondary" onclick="toggleSidebar()" style="border-radius:8px">
                <i class="fas fa-bars"></i>
            </button>
            <span class="brand-mobile" id="mobileBrand">ADPAY</span>
            <button class="btn btn-sm btn-primary d-none" id="goMobileBtn" onclick="switchToMobile()" style="border-radius:8px; margin-left:auto; font-size:.78rem;">
                <i class="fas fa-mobile-alt"></i> 모바일 버전
            </button>
        </div>

        <!-- Dynamic Page Content -->
        <div class="page-content" id="pageContent">
            <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
        </div>
    </div>

    <!-- Sidebar overlay for mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Modals -->
    <div class="modal fade" id="formModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content" style="border-radius:1rem; border:none;">
                <div class="modal-header" style="border-bottom:1px solid #f3f4f6;">
                    <h5 class="modal-title fw-bold" id="formModalTitle">-</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="formModalBody"></div>
                <div class="modal-footer" id="formModalFooter" style="border-top:1px solid #f3f4f6;">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                    <button type="button" class="btn btn-primary" id="formModalSave">저장</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
