<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f4c81">
    <meta name="mobile-web-app-capable" content="yes">
    <title>ADPAY - 로그인</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/static/favicon-192.png?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/manifest.webmanifest">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Noto Sans KR', sans-serif; box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body { background: linear-gradient(135deg, #0d1b2a 0%, #1b3a5c 100%); min-height: 100vh; min-height: 100dvh; }
        .login-container {
            min-height: 100vh; min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            padding: 1rem;
        }
        .login-wrapper { width: 100%; max-width: 440px; }
        .login-card { background: #fff; border-radius: 1.2rem; box-shadow: 0 20px 50px rgba(0,0,0,.3); overflow: hidden; width: 100%; }
        .login-header { background: linear-gradient(135deg, #0d1b2a, #1b3a5c); padding: 1.5rem 1.5rem 1.2rem; text-align: center; color: #fff; }
        .login-header h1 { font-size: 1.6rem; font-weight: 900; margin-bottom: 4px; }
        .login-brand { display:flex; align-items:center; justify-content:center; gap:10px; }
        .adpay-prefix { color:#20aeef; }
        .login-header p { font-size: .82rem; }
        .login-body { padding: 1.5rem; }
        .nav-pills .nav-link { border-radius: 50px; font-weight: 600; font-size: 0.85rem; padding: 7px 0; }
        .nav-pills .nav-link.active { background: #1b3a5c; }
        .form-control { border-radius: 10px; padding: 10px 14px; border: 1.5px solid #e5e7eb; font-size: 0.9rem; }
        .form-control:focus { border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14,165,233,.15); }
        .btn-login { border-radius: 50px; padding: 10px; font-weight: 700; font-size: 0.95rem; }
        .test-card { background: rgba(255,255,255,.06); border-radius: 1rem; border: 1.5px dashed rgba(255,255,255,.15); margin-top: .8rem; padding: 1rem !important; }
        .test-btn { border-radius: 8px; padding: 8px; font-weight: 600; font-size: 0.82rem; transition: all .2s; border-width: 2px; }
        .test-btn:hover { transform: translateY(-1px); }
        .test-btn i { width: 20px; }
        .divider { display: flex; align-items: center; gap: .8rem; margin: 1rem 0; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e5e7eb; }
        .divider span { white-space: nowrap; }
        .back-link { position: fixed; top: 16px; left: 16px; color: rgba(255,255,255,.7); text-decoration: none; font-size: 0.85rem; z-index: 10; }
        .back-link:hover { color: #fff; }

        /* Mobile responsive */
        @media (max-width: 480px) {
            .login-container { padding: .6rem; align-items: flex-start; padding-top: 2.5rem; }
            .login-header { padding: 1.2rem 1rem 1rem; }
            .login-header h1 { font-size: 1.4rem; }
            .login-body { padding: 1.2rem; }
            .login-card { border-radius: 1rem; }
            .form-control { min-height: 46px; padding: 9px 12px; font-size: 16px; }
            .btn-login { padding: 9px; font-size: .9rem; }
            .test-card { padding: .8rem !important; margin-top: .6rem; }
            .test-btn { padding: 7px; font-size: .78rem; }
            .test-btn, .btn-login { min-height: 44px; }
            .back-link { top: 10px; left: 10px; font-size: .8rem; }
        }
        @media (max-height: 700px) {
            .login-container { align-items: flex-start; padding-top: 1.5rem; }
            .login-header { padding: 1rem; }
            .login-header h1 { font-size: 1.3rem; }
            .login-body { padding: 1rem; }
            .mb-3 { margin-bottom: .6rem !important; }
            .mb-4 { margin-bottom: .8rem !important; }
        }
    </style>
</head>
<body>
    <a href="/static/landing/index.html" class="back-link"><i class="fas fa-arrow-left me-1"></i>홈으로</a>

    <div class="login-container">
        <div class="login-wrapper">
            <div class="login-card">
                <!-- Header -->
                <div class="login-header">
                    <h1 class="login-brand"><span><span class="adpay-prefix">AD</span>PAY</span></h1>
                    <p class="mb-0 opacity-80 small">결제와 마케팅을 하나로</p>
                </div>

                <div class="login-body">
                    <!-- Tabs -->
                    <ul class="nav nav-pills nav-fill mb-3" id="authTabs">
                        <li class="nav-item"><a class="nav-link active" href="#" onclick="showTab('login')">로그인</a></li>
                        <li class="nav-item"><a class="nav-link" href="#" onclick="showTab('register')">회원가입</a></li>
                    </ul>

                    <!-- Login Form -->
                    <div id="loginForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold small mb-1">이메일</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0" style="border-radius:10px 0 0 10px;"><i class="fas fa-envelope text-muted"></i></span>
                                <input type="email" class="form-control border-start-0" id="loginEmail" placeholder="email@example.com" style="border-radius:0 10px 10px 0;">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small mb-1">비밀번호</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0" style="border-radius:10px 0 0 10px;"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" class="form-control border-start-0" id="loginPassword" placeholder="비밀번호 입력" style="border-radius:0 10px 10px 0;">
                            </div>
                        </div>
                        <button class="btn btn-primary btn-login w-100" onclick="doLogin()">
                            <i class="fas fa-sign-in-alt me-2"></i>로그인
                        </button>
                    </div>

                    <!-- Register Form -->
                    <div id="registerForm" style="display:none;">
                        <div class="mb-3">
                            <label class="form-label fw-bold small mb-1">이름</label>
                            <input type="text" class="form-control" id="regName" placeholder="홍길동">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small mb-1">이메일</label>
                            <input type="email" class="form-control" id="regEmail" placeholder="email@example.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small mb-1">비밀번호</label>
                            <input type="password" class="form-control" id="regPassword" placeholder="6자 이상">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small mb-1">가입 유형</label>
                            <select class="form-select form-control" id="regRole" onchange="onRegRoleChange()">
                                <option value="OWNER" selected>원장 (매장 운영)</option>
                                <option value="SALES">영업관리자</option>
                            </select>
                        </div>
                        <!-- OWNER 전용 -->
                        <div id="regOwnerFields">
                            <div class="mb-3">
                                <label class="form-label fw-bold small mb-1">매장명</label>
                                <input type="text" class="form-control" id="regShopName" placeholder="예) 애드페이 헤어살롱">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold small mb-1">추천 코드 <span class="text-muted fw-normal">(선택)</span></label>
                                <input type="text" class="form-control" id="regReferralCode" placeholder="영업관리자 추천코드(선택)">
                            </div>
                        </div>
                        <!-- SALES 전용 -->
                        <div id="regSalesNotice" class="alert alert-info py-2 mb-3" style="display:none;border-radius:10px;font-size:.82rem;">
                            <i class="fas fa-info-circle me-1"></i>영업관리자는 가입 후 <strong>추천 코드가 자동으로 생성</strong>됩니다.
                            생성된 코드를 원장님께 전달하면 가맹점이 자동으로 연결됩니다.
                        </div>
                        <button class="btn btn-success btn-login w-100" onclick="doRegister()">
                            <i class="fas fa-user-plus me-2"></i>회원가입
                        </button>
                    </div>

                    <!-- Alert -->
                    <div id="authAlert" class="alert mt-2 d-none" style="border-radius:10px;font-size:.85rem;"></div>
                </div>
            </div>

            <div class="test-card text-white">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <strong class="small"><i class="fas fa-flask me-1 text-warning"></i>테스트 계정 바로 로그인</strong>
                    <span class="badge bg-warning text-dark">개발 전용</span>
                </div>
                <div class="row g-2">
                    <div class="col-6"><button type="button" class="btn btn-outline-warning test-btn w-100" onclick="testLogin('admin')"><i class="fas fa-crown"></i>최고관리자</button></div>
                    <div class="col-6"><button type="button" class="btn btn-outline-info test-btn w-100" onclick="testLogin('sales')"><i class="fas fa-user-tie"></i>영업관리자</button></div>
                    <div class="col-6"><button type="button" class="btn btn-outline-light test-btn w-100" onclick="testLogin('owner')"><i class="fas fa-store"></i>원장</button></div>
                    <div class="col-6"><button type="button" class="btn btn-outline-success test-btn w-100" onclick="testLogin('designer')"><i class="fas fa-cut"></i>디자이너</button></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API = '';

        function showTab(tab) {
            document.getElementById('loginForm').style.display = tab === 'login' ? '' : 'none';
            document.getElementById('registerForm').style.display = tab === 'register' ? '' : 'none';
            document.querySelectorAll('#authTabs .nav-link').forEach((el, i) => {
                el.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
            });
            hideAlert();
        }

        function showAlert(msg, type) {
            const el = document.getElementById('authAlert');
            el.className = `alert mt-2 alert-${type}`;
            el.textContent = msg;
            el.classList.remove('d-none');
        }
        function hideAlert() {
            document.getElementById('authAlert').classList.add('d-none');
        }

        function handleAuthSuccess(data) {
            localStorage.setItem('access_token', data.access_token);
            localStorage.setItem('refresh_token', data.refresh_token);
            localStorage.setItem('user', JSON.stringify(data.user));
            window.location.href = '/static/dashboard.html';
        }

        async function doLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            if (!email || !password) { showAlert('이메일과 비밀번호를 입력하세요', 'warning'); return; }
            try {
                const res = await fetch(API + '/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, password})
                });
                const data = await res.json();
                if (!res.ok) { showAlert(data.detail || '로그인 실패', 'danger'); return; }
                handleAuthSuccess(data);
            } catch (e) { showAlert('서버 연결 오류', 'danger'); }
        }

        function onRegRoleChange() {
            const role = document.getElementById('regRole').value;
            document.getElementById('regOwnerFields').style.display = role === 'OWNER' ? '' : 'none';
            document.getElementById('regSalesNotice').style.display = role === 'SALES' ? '' : 'none';
        }

        async function doRegister() {
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const role = document.getElementById('regRole').value;
            if (!name || !email || !password) { showAlert('모든 필드를 입력하세요', 'warning'); return; }

            const payload = {name, email, password, role};
            if (role === 'OWNER') {
                const shopName = document.getElementById('regShopName').value.trim();
                const referral = document.getElementById('regReferralCode').value.trim();
                if (!shopName) { showAlert('매장명을 입력하세요', 'warning'); return; }
                payload.shop_name = shopName;
                if (referral) payload.sales_referral_code = referral;
            }

            try {
                const res = await fetch(API + '/api/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) { showAlert(data.detail || '가입 실패', 'danger'); return; }
                handleAuthSuccess(data);
            } catch (e) { showAlert('서버 연결 오류', 'danger'); }
        }

        async function testLogin(role) {
            try {
                showAlert('테스트 계정으로 로그인 중...', 'info');
                const res = await fetch(API + `/api/auth/test-login?role=${role}`, {method: 'POST'});
                const data = await res.json();
                if (!res.ok) { showAlert(data.detail || '테스트 로그인 실패', 'danger'); return; }
                handleAuthSuccess(data);
            } catch (e) { showAlert('서버 연결 오류', 'danger'); }
        }

        // Enter key support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (document.getElementById('loginForm').style.display !== 'none') doLogin();
                else doRegister();
            }
        });

        // If already logged in, redirect
        if (localStorage.getItem('access_token')) {
            window.location.href = '/static/dashboard.html';
        }
    </script>
</body>
</html>
